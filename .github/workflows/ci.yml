name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run format-and-lint

      - name: Type check
        run: bun run check-types

      - name: Build workspace
        run: bun run build

      - name: Test
        run: bun run test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options:
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: build
          push: false
          load: true
          tags: example-migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run migrations
        run: >
          docker run --rm
          --network host
          -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/ci
          example-migrate:ci
          bun run db:migrate

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: example-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start API container
        run: >
          docker run -d --rm
          --name example-api-ci
          --network host
          -e NODE_ENV=production
          -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/ci
          -e BETTER_AUTH_URL=http://127.0.0.1:3000
          -e BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          example-api:ci

      - name: Smoke test API container
        run: |
          curl --fail --silent --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:3000/health \
            || { docker logs example-api-ci; exit 1; }
